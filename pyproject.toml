[project]
name = "world-model"
version = "0.1.0"
description = "Experiments with world models: latent-prediction agents that learn games, starting with MiniGrid"
readme = "README.md"
authors = [
    { name = "David Verholen" }
]
requires-python = ">=3.12"
dependencies = [
    "crafter>=1.8.3",
    "einops>=0.8.2",
    "gymnasium[other]>=1.3.0",
    "imageio>=2.37.3",
    "minigrid>=3.1.0",
    "numpy>=2.4.6",
    "sentence-transformers>=5.5.1",
    "tensorboard>=2.20.0",
    "torch>=2.12.0",
]

[project.optional-dependencies]
rtfm = [
    "crafter-rtfm",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

# Windows needs CUDA wheels from the PyTorch index;
# Linux gets CUDA-bundled wheels from PyPI as usual. See docs/REMOTE.md.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
crafter-rtfm = { path = "../crafter-rtfm", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
