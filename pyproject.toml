[project]
name = "world-model"
version = "0.1.0"
description = "Experiments with world models: latent-prediction agents that learn games, starting with MiniGrid"
readme = "README.md"
authors = [
    { name = "David Verholen", email = "david.verholen@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "gymnasium[other]>=1.3.0",
    "imageio>=2.37.3",
    "minigrid>=3.1.0",
    "numpy>=2.4.6",
    "tensorboard>=2.20.0",
    "torch>=2.12.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
